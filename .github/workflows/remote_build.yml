# Builds the TV app with the phone remote control server for this fork.
# The other workflows in this folder need upstream (recloudstream) secrets and only run on master.
name: Remote control build

on:
  push:
    branches-ignore: [ master ]
    tags: [ 'v*' ]
    paths-ignore:
      - '*.md'
      - 'fastlane/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/ccr-69551067-qenlla' }}

      - name: Build stable debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStableDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-tv-remote-${{ github.sha }}
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cloudstream-tv-remote-${{ github.sha }}
          path: apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "CloudStream (remote control) $TAG" \
            --notes "TV build of CloudStream with the phone remote control server. Install on the TV, then enable Settings > General > Phone remote control."
